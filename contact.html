<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Pro - Contacto</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/_layout.css">
    <link rel="stylesheet" href="css/_modules.css">
</head>
<body>

    <header>
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="logo">Mi Nombre</h1>
            <nav class="nav-main">
                <a href="index.html" class="nav-link">Inicio</a>
                <a href="about.html" class="nav-link">Acerca de Mí</a>
                <a href="projects.html" class="nav-link">Proyectos</a>
                <a href="contact.html" class="nav-link active">Contacto</a> </nav>
        </div>
    </header>

    <main class="container py-5">
        <h2 class="display-4 mb-4 text-center text-primary">Conversemos</h2>
        
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 shadow-lg">
                    
                    <p class="lead text-center mb-4">Estoy disponible para nuevos proyectos y oportunidades. ¡Déjame un mensaje!</p>
                    
                    <form>
                        <div class="mb-3">
                            <label for="inputName" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="inputName" required>
                        </div>

                        <div class="mb-3">
                            <label for="inputEmail" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="inputEmail" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="inputSubject" class="form-label">Asunto</label>
                            <input type="text" class="form-control" id="inputSubject">
                        </div>

                        <div class="mb-3">
                            <label for="inputMessage" class="form-label">Mensaje</label>
                            <textarea class="form-control" id="inputMessage" rows="5" required></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-cta">Enviar Mensaje</button>
                        </div>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center">
                        <p class="mb-1">O contáctame directamente:</p>
                        <p class="mb-0">
                            <strong>Email:</strong> tu.email@dominio.com | 
                            <strong>LinkedIn:</strong> <a href="#" target="_blank">/TuPerfilLinkedIn</a>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Mi Portafolio | Hecho con Bootstrap 5</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/main.js"></script>
</body>
</html>
